<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Неоновый сборщик 4 — онлайн</title>
<style>html,body{margin:0;height:100%;background:#070914;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
/* ===== ЧАСТЬ 1: ядро (игроки, враги, босс, оружие) ===== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',resize);resize();
let best=0;try{best=+localStorage.getItem('neonBest')||0}catch(e){}
const STICK_MAX=55,FLASH_TIME=0.08,WORLD_W=2400,WORLD_H=2400,MAXP=6;
const PCOL=['#6f8','#4df','#fd4','#f4a','#c58bff','#ff9a4a'];
const WEAPONS=[
{id:'revolver',name:'Револьвер',mag:6,fireDelay:0.28,reload:1.4,muzzle:38,maxRes:99,startRes:24,crate:18,label:'взрывные в барабане / запас'},
{id:'shotgun',name:'Дробовик',mag:2,fireDelay:0.75,reload:1.7,muzzle:58,maxRes:40,startRes:10,crate:6,label:'в магазине / запас'},
{id:'molotov',name:'Молотов',mag:1,fireDelay:0.9,reload:0.8,muzzle:30,maxRes:15,startRes:4,crate:2,label:'в руке / запас'},
{id:'minigun',name:'Миниган',mag:150,fireDelay:0.05,reload:3.5,muzzle:58,maxRes:300,startRes:150,crate:60,label:'в ленте / запас'}];
const BOSS_NAMES=['Гигант','Паук','Жнец','Титан'];

// сеть и режимы: menu | mp | play | over
let mode='menu',isHost=true,net=null,lobby=null,me='me',hostPeer=null,rooms=[],status='',btns=[],rid0='',overAt=0,saved=false;
// игроки: id -> объект игрока (у каждого своё оружие, патроны, жизни, очки)
let P={};
let time,spawnT,orbT,powT,enemies,orbs,powers,parts,bullets,bombs,fires,blasts,crates,texts,shake;
let boss=null,bossShots=[],bossT=40,bossCount=0,timeStop=0,timeWave=null,camX=0,camY=0;
const stick={active:false,id:null,bx:0,by:0,kx:0,ky:0,vx:0,vy:0},fireIds=new Set(),keys={};

function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
const alive=()=>Object.values(P).filter(p=>p.lives>0);
const rp=()=>{const a=alive();return a[a.length*Math.random()|0]||null};
const nearest=(o,L)=>{let b=null,bd=1e9;for(const p of L){const d=dist(o,p);if(d<bd){bd=d;b=p}}return b};
const lp=()=>P[me];                                  // локальный игрок

function mkP(i){return{x:WORLD_W/2+rand(-60,60),y:WORLD_H/2+rand(-60,60),r:14,aim:-Math.PI/2,lives:3,score:0,combo:1,comboT:0,shield:0,inv:0,
 ws:WEAPONS.map(w=>({ammo:w.mag,reserve:w.startRes})),cur:0,reloadT:0,fireCd:0,flashT:0,spin:0,spinA:0,
 mx:0,my:0,fire:false,tgt:null,timeCd:0,c:i}}

function reset(ids){
 time=0;spawnT=0;orbT=0;powT=8;
 enemies=[];orbs=[];powers=[];parts=[];bullets=[];bombs=[];fires=[];blasts=[];crates=[];texts=[];shake=0;
 bossShots=[];boss=null;bossT=40;bossCount=0;timeStop=0;timeWave=null;saved=false;
 P={};ids.forEach((id,i)=>{P[id]=mkP(i)});
 const l=lp()||Object.values(P)[0];camX=(l?l.x:WORLD_W/2)-W/2;camY=(l?l.y:WORLD_H/2)-H/2;
 for(let i=0;i<10;i++)spawnOrb(i<5);
}
function addPlayer(id){if(P[id]||Object.keys(P).length>=MAXP)return;P[id]=mkP(Object.keys(P).length)}

function spawnOrb(near){
 let x,y;const c=near?rp():null;
 if(c){x=c.x+rand(-600,600);y=c.y+rand(-600,600)}else{x=rand(40,WORLD_W-40);y=rand(40,WORLD_H-40)}
 orbs.push({x:Math.max(30,Math.min(WORLD_W-30,x)),y:Math.max(30,Math.min(WORLD_H-30,y)),r:9,pulse:rand(0,6)});
}
function spawnEnemy(){
 const c=rp();if(!c)return;
 let x,y,ok=false;const rad=Math.max(Math.hypot(W,H)/2+50,520);
 for(let i=0;i<10&&!ok;i++){const a=rand(0,Math.PI*2);x=c.x+Math.cos(a)*rad;y=c.y+Math.sin(a)*rad;ok=x>20&&x<WORLD_W-20&&y>20&&y<WORLD_H-20}
 if(!ok)return;
 const hunter=Math.random()<Math.min(0.15+time/120,0.5),sp=rand(1.2,2.2)+time/60;
 const a=Math.atan2(c.y-y,c.x-x)+rand(-0.5,0.5);
 enemies.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:hunter?13:11,hunter,hp:hunter?2:1,speed:sp*0.7,life:0,burn:0});
}
function spawnCrate(){
 const c=rp()||{x:WORLD_W/2,y:WORLD_H/2};
 const tx=Math.max(60,Math.min(WORLD_W-60,c.x+rand(-380,380))),ty=Math.max(60,Math.min(WORLD_H-60,c.y+rand(-300,300)));
 crates.push({x:tx,y:ty-520,ty,landed:false,life:30,t:0});
 say('Сброс патронов! Смотри на стрелку','#ff9a7a',18,0.2);
}
// экранная надпись (у хоста — сразу, у гостей приходит событием 'fx')
function say(text,color,size,yk){
 texts.push({x:W/2,y:H*(yk||0.28),life:2.4,text,color,size:size||22,s:true});
 if(isHost&&net)net.emit('fx',{t:text,c:color,s:size||22,y:yk||0.28});
}
function burst(x,y,color,n=14){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(1,5);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color})}}

/* ---------- урон игроку, конец игры ---------- */
function gameOver(){
 mode='over';overAt=performance.now();stick.active=false;stick.vx=stick.vy=0;fireIds.clear();
 const l=lp();if(l&&!saved){saved=true;if(l.score>best){best=l.score;try{localStorage.setItem('neonBest',best)}catch(_){}}}
}
// щит гасит удар; invT — неуязвимость после удара
function hurtP(p,invT){
 if(p.inv>0||p.lives<=0||mode!=='play')return;
 if(p.shield>0){burst(p.x,p.y,'#4df',12);p.inv=Math.min(invT,0.4);return}
 p.lives--;p.combo=1;p.inv=invT;if(p===lp())shake=12;burst(p.x,p.y,'#f44',24);
 if(!alive().length)gameOver();
}

/* ---------- босс ---------- */
function spawnBoss(){
 const c=rp();if(!c)return;
 let x,y,ok=false;const rad=Math.max(Math.hypot(W,H)/2+120,600);
 for(let i=0;i<12&&!ok;i++){const a=rand(0,Math.PI*2);x=c.x+Math.cos(a)*rad;y=c.y+Math.sin(a)*rad;ok=x>70&&x<WORLD_W-70&&y>70&&y<WORLD_H-70}
 if(!ok){x=Math.max(70,Math.min(WORLD_W-70,c.x+rad));y=Math.max(70,Math.min(WORLD_H-70,c.y))}
 const n=alive().length,maxHp=(220+bossCount*90)*(1+0.6*(n-1));      // чем больше игроков, тем жирнее босс
 boss={x,y,vx:0,vy:0,r:40,hp:maxHp,maxHp,shootT:1.5,pat:1,t:0,hit:0,name:BOSS_NAMES[bossCount%BOSS_NAMES.length]};
 say('БОСС: '+boss.name.toUpperCase(),'#ff4d9a',26);shake=10;
}
function hurtBoss(dmg){if(!boss)return;boss.hp-=dmg;if(dmg>=1)boss.hit=0.08;if(boss.hp<=0)killBoss()}
function killBoss(){
 const b=boss;boss=null;bossShots=[];
 const reward=500+250*bossCount;
 alive().forEach(p=>p.score+=reward);                // награда каждому живому
 bossCount++;bossT=55;
 for(let i=0;i<4;i++)blasts.push({x:b.x+rand(-b.r,b.r),y:b.y+rand(-b.r,b.r),t:-i*0.12,dur:0.6,R:90});
 burst(b.x,b.y,'#c25bff',50);burst(b.x,b.y,'#ffd24a',30);shake=18;
 say('БОСС ПОВЕРЖЕН! +'+reward,'#ffd24a',22);spawnCrate();
}

/* ---------- остановка времени (общая для всех) ---------- */
const TB=()=>({x:W-165,y:H-160,r:32});
function activateTime(p){
 if(mode!=='play'||timeStop>0||p.timeCd>0||p.lives<=0)return;
 timeStop=10;timeWave={x:p.x,y:p.y,t:0};shake=Math.max(shake,6);
}

/* ---------- взрыв и урон врагам; o — id стрелявшего (очки ему) ---------- */
function explode(x,y,o){
 const R=75;blasts.push({x,y,t:0,dur:0.45,R});shake=Math.max(shake,7);
 burst(x,y,'#ff8a2a',22);burst(x,y,'#ffd24a',14);
 for(const en of enemies){
  if(en.dead)continue;const d=Math.hypot(en.x-x,en.y-y);
  if(d<R+en.r){const a=Math.atan2(en.y-y,en.x-x);en.x+=Math.cos(a)*14;en.y+=Math.sin(a)*14;hurt(en,d<38?2:1,o)}
 }
 if(boss){const bd=Math.hypot(boss.x-x,boss.y-y);if(bd<R+boss.r)hurtBoss(bd<boss.r?4:2)}
}
function hurt(e,dmg,o){
 e.hp-=dmg;
 if(e.hp<=0&&!e.dead){e.dead=true;if(P[o])P[o].score+=e.hunter?25:15;burst(e.x,e.y,e.hunter?'#f4a':'#f54',16)}
}

/* ---------- оружие ---------- */
const RB=()=>({x:W-85,y:H-190,r:34}),slotRect=i=>({x:W-66,y:78+i*60,w:50,h:52});
function selectWeapon(p,i){
 if(i===p.cur||mode!=='play'||p.lives<=0)return;
 p.cur=i;p.reloadT=0;p.fireCd=0.25;p.spin=0;
 if(p===lp())texts.push({x:p.x,y:p.y-42,life:0.9,text:WEAPONS[i].name,color:'#cde',size:14});
}
function startReload(p){
 const w=WEAPONS[p.cur],s=p.ws[p.cur];
 if(mode==='play'&&p.lives>0&&p.reloadT<=0&&s.ammo<w.mag&&s.reserve>0)p.reloadT=w.reload;
}
function shoot(p,id){
 const w=WEAPONS[p.cur],s=p.ws[p.cur];
 s.ammo--;p.fireCd=w.fireDelay;
 const d=p.r-4+w.muzzle,bx=p.x+Math.cos(p.aim)*d,by=p.y+Math.sin(p.aim)*d,loc=p===lp();
 if(w.id==='revolver'){
  p.flashT=FLASH_TIME;if(loc)shake=Math.max(shake,3);
  bullets.push({x:bx,y:by,vx:Math.cos(p.aim)*13,vy:Math.sin(p.aim)*13,life:1.2,exp:true,o:id});
  for(let i=0;i<6;i++){const a=p.aim+rand(-0.4,0.4),sp=rand(2,6);parts.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.6,color:'#ffd27a'})}
 }else if(w.id==='shotgun'){
  p.flashT=FLASH_TIME;if(loc)shake=Math.max(shake,8);
  for(let i=0;i<7;i++){const a=p.aim+rand(-0.3,0.3),sp=rand(11,14);bullets.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5,pellet:true,o:id})}
  for(let i=0;i<10;i++){const a=p.aim+rand(-0.5,0.5),sp=rand(2,7);parts.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.7,color:i%2?'#ffd27a':'#ff9a4a'})}
 }else if(w.id==='minigun'){
  p.flashT=FLASH_TIME;if(loc)shake=Math.max(shake,2);
  const a=p.aim+rand(-0.07,0.07),off=rand(-3,3);
  bullets.push({x:bx-Math.sin(p.aim)*off,y:by+Math.cos(p.aim)*off,vx:Math.cos(a)*15,vy:Math.sin(a)*15,life:1.0,mini:true,o:id});
  parts.push({x:p.x+Math.cos(p.aim)*20,y:p.y+Math.sin(p.aim)*20,vx:rand(-3,3)-Math.sin(p.aim)*3,vy:rand(-3,3)+Math.cos(p.aim)*3,life:0.5,color:'#d9a441'});
 }else{
  let tx,ty;const t=p.tgt;
  if(t){tx=t.x+(t.vx||0)*36;ty=t.y+(t.vy||0)*36}else{tx=p.x+Math.cos(p.aim)*220;ty=p.y+Math.sin(p.aim)*220}
  const ddx=tx-p.x,ddy=ty-p.y,len=Math.hypot(ddx,ddy)||1,L=Math.max(90,Math.min(360,len));
  tx=Math.max(25,Math.min(WORLD_W-25,p.x+ddx/len*L));ty=Math.max(25,Math.min(WORLD_H-25,p.y+ddy/len*L));
  bombs.push({sx:bx,sy:by,dx:tx,dy:ty,t:0,dur:0.5+L/900,rot:0,o:id});
 }
 if(s.ammo<=0&&s.reserve>0)p.reloadT=w.reload;
}
/* ===== конец части 1 (дальше: ввод и меню, update, сеть, отрисовка) ===== */
/* ===== ЧАСТЬ 2: ввод и симуляция ===== */
// действия игрока: у хоста применяются сразу, у гостя уходят хосту событием
function act(k,v){
 const p=lp();if(!p||mode!=='play')return;
 if(isHost){if(k==='w')selectWeapon(p,v);else if(k==='r')startReload(p);else if(k==='t')activateTime(p)}
 else if(net)net.emit('act',{k,v});
}
function readInput(){
 let mx=stick.vx,my=stick.vy;
 if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
 if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
 const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
 return{mx:+mx.toFixed(2),my:+my.toFixed(2),f:(fireIds.size>0||keys.Space)?1:0};
}
function press(e){
 if(mode!=='play'){
  if(mode==='over'&&performance.now()-overAt<600)return;
  for(const b of btns)if(e.clientX>b.x&&e.clientX<b.x+b.w&&e.clientY>b.y&&e.clientY<b.y+b.h){b.f();return}
  return;
 }
 for(let i=0;i<WEAPONS.length;i++){
  const r=slotRect(i);
  if(e.clientX>r.x-6&&e.clientX<r.x+r.w+6&&e.clientY>r.y-4&&e.clientY<r.y+r.h+4){act('w',i);return}
 }
 const b=RB();if(Math.hypot(e.clientX-b.x,e.clientY-b.y)<b.r){act('r');return}
 const tb=TB();if(Math.hypot(e.clientX-tb.x,e.clientY-tb.y)<tb.r+4){act('t');return}
 if(e.clientX<W*0.5&&!stick.active){
  stick.active=true;stick.id=e.pointerId;stick.bx=stick.kx=e.clientX;stick.by=stick.ky=e.clientY;stick.vx=stick.vy=0;
 }else if(e.clientX>=W*0.5)fireIds.add(e.pointerId);
}
function moveP(e){
 if(stick.active&&e.pointerId===stick.id){
  let dx=e.clientX-stick.bx,dy=e.clientY-stick.by;const len=Math.hypot(dx,dy);
  if(len>STICK_MAX){dx=dx/len*STICK_MAX;dy=dy/len*STICK_MAX}
  stick.kx=stick.bx+dx;stick.ky=stick.by+dy;
  const m=Math.hypot(dx,dy)/STICK_MAX;
  if(m<0.12){stick.vx=stick.vy=0}else{stick.vx=dx/STICK_MAX;stick.vy=dy/STICK_MAX}
 }
}
function release(e){
 if(stick.active&&e.pointerId===stick.id){stick.active=false;stick.id=null;stick.vx=stick.vy=0}
 fireIds.delete(e.pointerId);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}press(e)});
cv.addEventListener('pointermove',e=>{e.preventDefault();moveP(e)});
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
 keys[e.code]=true;if(e.code==='Space')e.preventDefault();
 if(e.code==='KeyR')act('r');if(e.code==='KeyT')act('t');
 ['Digit1','Digit2','Digit3','Digit4'].forEach((c,i)=>{if(e.code===c)act('w',i)});
});
addEventListener('keyup',e=>{keys[e.code]=false});

/* ---------- один игрок: движение, прицел, стрельба, перезарядка ---------- */
function updP(id,p,dt){
 if(p.lives<=0)return;
 const w=WEAPONS[p.cur],s=p.ws[p.cur];
 let mx=p.mx,my=p.my;const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
 const firing=!!p.fire;
 const spd=(w.id==='minigun'&&firing&&s.ammo>0)?190:290;
 p.x=Math.max(p.r,Math.min(WORLD_W-p.r,p.x+mx*spd*dt));p.y=Math.max(p.r,Math.min(WORLD_H-p.r,p.y+my*spd*dt));
 p.tgt=null;let bd=1e9;
 for(const e of enemies){const d=dist(e,p);if(d<bd&&d<620){bd=d;p.tgt=e}}
 if(boss){const d=dist(boss,p)-boss.r;if(d<bd&&d<620){bd=d;p.tgt=boss}}
 let want=p.aim;
 if(p.tgt)want=Math.atan2(p.tgt.y-p.y,p.tgt.x-p.x);else if(ml>0.2)want=Math.atan2(my,mx);
 let da=want-p.aim;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
 p.aim+=da*Math.min(1,dt*18);
 if(p.fireCd>0)p.fireCd-=dt;if(p.flashT>0)p.flashT-=dt;if(p.inv>0)p.inv-=dt;
 if(timeStop<=0&&p.timeCd>0)p.timeCd-=dt;
 if(s.ammo<=0&&s.reserve>0&&p.reloadT<=0)p.reloadT=w.reload;
 if(p.reloadT>0){p.reloadT-=dt;if(p.reloadT<=0){p.reloadT=0;const t=Math.min(w.mag-s.ammo,s.reserve);s.ammo+=t;s.reserve-=t}}
 if(w.id==='minigun'&&firing&&s.ammo>0&&p.reloadT<=0)p.spin=Math.min(1,p.spin+dt*2.5);else p.spin=Math.max(0,p.spin-dt*2);
 p.spinA+=dt*p.spin*34;
 if(firing&&s.ammo>0&&p.reloadT<=0&&p.fireCd<=0&&(w.id!=='minigun'||p.spin>=0.7))shoot(p,id);
}

/* ---------- мир (только у хоста) ---------- */
function update(dt){
 time+=dt;
 const L=lp();if(L){const i=readInput();L.mx=i.mx;L.my=i.my;L.fire=!!i.f}
 for(const id in P)updP(id,P[id],dt);
 const al=alive();
 if(L){camX+=(Math.max(0,Math.min(WORLD_W-W,L.x-W/2))-camX)*Math.min(1,dt*9);camY+=(Math.max(0,Math.min(WORLD_H-H,L.y-H/2))-camY)*Math.min(1,dt*9)}

 const realDt=dt;
 if(timeWave){timeWave.t+=dt;if(timeWave.t>0.7)timeWave=null}
 if(timeStop>0){timeStop-=dt;if(timeStop<=0){timeStop=0;for(const id in P)P[id].timeCd=30}}
 dt=timeStop>0?0:dt;
 for(const p of al){if(p.shield>0)p.shield-=dt;if(p.comboT>0){p.comboT-=dt;if(p.comboT<=0)p.combo=1}}

 spawnT-=dt;if(spawnT<=0){spawnEnemy();spawnT=Math.max(0.4,1.5-time/45)/(1+0.5*(al.length-1))}
 orbT-=dt;if(orbT<=0&&orbs.length<14+4*al.length){spawnOrb(Math.random()<0.5);orbT=0.7}
 powT-=dt;
 if(powT<=0){const c=rp();if(c)powers.push({x:Math.max(40,Math.min(WORLD_W-40,c.x+rand(-600,600))),y:Math.max(40,Math.min(WORLD_H-40,c.y+rand(-600,600))),r:11,life:12});powT=rand(12,20)/(1+0.4*(al.length-1))}

 // ящики с патронами
 crateT-=dt;
 const low=al.some(p=>p.ws.reduce((a,x)=>a+x.ammo+x.reserve,0)<=3);
 if(low&&crates.length===0&&crateT>2.5)crateT=2.5;
 if(crateT<=0){spawnCrate();crateT=rand(15,22)}
 for(const c of crates){
  c.t+=dt;
  if(!c.landed){c.y+=110*dt;if(c.y>=c.ty){c.y=c.ty;c.landed=true;burst(c.x,c.y+8,'#c9b27a',14)}}
  else{
   c.life-=dt;
   for(const p of al)if(!c.dead&&Math.hypot(c.x-p.x,c.y-p.y)<p.r+18){
    c.dead=true;WEAPONS.forEach((ww,i)=>{p.ws[i].reserve=Math.min(ww.maxRes,p.ws[i].reserve+ww.crate)});
    texts.push({x:c.x,y:c.y-24,life:1.4,text:'+'+WEAPONS.map(x=>x.crate).join(' / +'),color:'#ffd27a',size:17});burst(c.x,c.y,'#ffd27a',18);
   }

/* ---------- онлайн без Claude: тот же интерфейс комнат поверх WebSocket ---------- */
function makeShim(url){
 let ws=null,myId=null,q=[];const chans={};
 const toPeer=x=>({peer:x.peer,presence:x.presence||{},isMe:x.peer===myId,sameTab:x.peer===myId,kind:'viewer',guest:false});
 function send(o){const s=JSON.stringify(o);if(ws&&ws.readyState===1)ws.send(s);else q.push(s)}
 ws=new WebSocket(url);
 ws.onopen=()=>{const a=q;q=[];a.forEach(s=>ws.send(s))};
 ws.onmessage=e=>{
  let m;try{m=JSON.parse(e.data)}catch(_){return}
  if(m.t==='hello'){myId=m.id;return}
  const c=chans[m.room];if(!c)return;
  if(m.t==='peers'){
   c.list=m.list.map(toPeer);
   const joined=c.list.filter(p=>m.joined.includes(p.peer)),left=m.left.map(id=>({peer:id,isMe:id===myId,presence:{}}));
   c.pH.slice().forEach(f=>f({peers:c.list,joined,left,updated:[]}));
   if(c.ready){c.ready();c.ready=null}
  }else if(m.t==='ev'){
   (c.evH[m.topic]||[]).slice().forEach(f=>f({topic:m.topic,data:m.data,peer:m.peer,isMe:false,sameTab:false,kind:'viewer',guest:false}));
  }else if(m.t==='full'&&c.fail){c.fail(new Error('full'))}
 };
 function chan(name){
  const c={name,list:[],evH:{},pH:[],ready:null,fail:null};
  c.emit=(t,d)=>{send({t:'emit',room:name,topic:t,data:d});return Promise.resolve()};
  c.on=(t,f)=>{(c.evH[t]=c.evH[t]||[]).push(f);return()=>{c.evH[t]=(c.evH[t]||[]).filter(x=>x!==f)}};
  c.onPeers=f=>{c.pH.push(f);if(c.list.length)f({peers:c.list,joined:c.list,left:[],updated:[]});return()=>{c.pH=c.pH.filter(x=>x!==f)}};
  c.peers=()=>c.list;
  c.presence=p=>{send({t:'pres',room:name,patch:p});return Promise.resolve()};
  c.leave=()=>{send({t:'leave',room:name});delete chans[name];return Promise.resolve()};
  chans[name]=c;
  return new Promise((res,rej)=>{c.ready=()=>res(c);c.fail=rej;send({t:'join',room:name});setTimeout(()=>rej(new Error('timeout')),8000)});
 }
 return{lobby:async()=>{const c=await chan('_lobby');c.join=n=>chan(n);return c}};
}

async function getLobby(){
 if(lobby)return lobby;
 try{if(window.claude&&claude.use)lobby=await claude.use('room');else lobby=await makeShim((location.protocol==='https:'?'wss://':'ws://')+location.host).lobby()}catch(e){lobby=null}
 if(lobby)lobby.onPeers(()=>{rooms=lobby.peers().filter(p=>p.presence&&p.presence.rid&&!p.isMe).map(p=>({rid:p.presence.rid,n:p.presence.n|0,peer:p.peer}))});

}
async function hostRoom(){
 status='Создаю комнату…';const L=await getLobby();
 if(!L){status='Нет связи с сервером. Обнови страницу';return}
 try{
  const rid='g'+Math.random().toString(36).slice(2,8);rid0=rid;isHost=true;reset([]);
  net=await L.join(rid);
  net.onPeers(c=>{
   for(const p of c.peers)if(p.sameTab)me=p.peer;
   for(const p of c.joined)if(p.kind==='viewer')addPlayer(p.peer);
   for(const p of c.left)delete P[p.peer];
   L.presence({rid,n:Object.keys(P).length});
  });
  net.on('inp',m=>{const p=P[m.peer],d=m.data;if(!p||m.isMe||!d)return;
   p.mx=Math.max(-1,Math.min(1,+d.mx||0));p.my=Math.max(-1,Math.min(1,+d.my||0));p.fire=!!d.f});
  net.on('act',m=>{const p=P[m.peer],d=m.data;if(!p||m.isMe||!d)return;
   if(d.k==='w'&&d.v>=0&&d.v<4)selectWeapon(p,d.v|0);else if(d.k==='r')startReload(p);else if(d.k==='t')activateTime(p)});
  mode='play';status='';
 }catch(e){status='Не удалось создать комнату';net=null}
}
async function joinRoom(r){

}

 for(let x=gx0;x<=gx1;x+=40){ctx.strokeStyle=x%200===0?'rgba(80,100,200,0.18)':'rgba(80,100,200,0.07)';ctx.beginPath();ctx.moveTo(x,gy0);ctx.lineTo(x,gy1);ctx.stroke()}
 for(let y=gy0;y<=gy1;y+=40){ctx.strokeStyle=y%200===0?'rgba(80,100,200,0.18)':'rgba(80,100,200,0.07)';ctx.beginPath();ctx.moveTo(gx0,y);ctx.lineTo(gx1,y);ctx.stroke()}
 glow('#6f8',16);ctx.strokeStyle='rgba(111,255,136,0.75)';ctx.lineWidth=4;ctx.strokeRect(0,0,WORLD_W,WORLD_H);ctx.shadowBlur=0;

 drawFires();for(const c of crates)drawCrate(c);
 for(const o of orbs)circle(o.x,o.y,o.r+Math.sin(o.pulse)*2,'#fd4');
 for(const p of powers){ctx.globalAlpha=p.life<2?(Math.sin(time*20)>0?1:0.3):1;circle(p.x,p.y,p.r,'#4df');ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle='#070914';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('S',p.x,p.y+5)}
 for(const e of enemies){
  circle(e.x,e.y,e.r,e.hunter?'#f4a':'#f54');
  if(e.hunter&&e.hp<=1){ctx.shadowBlur=0;ctx.fillStyle='#070914';ctx.beginPath();ctx.arc(e.x,e.y,5,0,Math.PI*2);ctx.fill()}
  if(e.burn>0){glow('#ff8a2a',14);ctx.strokeStyle='#ffb04a';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
 }
 if(play&&L.lives>0){                                   // кольцо на цели
  let t=null,bd=620;for(const e of enemies){const d=dist(e,L);if(d<bd){bd=d;t=e}}
  if(boss){const d=dist(boss,L)-boss.r;if(d<bd)t=boss}
  if(t){ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(t.x,t.y,t.r+6,0,Math.PI*2);ctx.stroke()}
 }
 for(const b of bullets){
  if(b.pellet)circle(b.x,b.y,2.5,'#ffcf70',10);else if(b.mini)circle(b.x,b.y,2.5,'#fff2b0',8);
  else if(b.exp){circle(b.x,b.y,4.5,'#ff6a3a',18);circle(b.x,b.y,2,'#fff2b0',6)}else circle(b.x,b.y,3.5,'#ffe9a8',14);
 }
 drawBoss();drawBombs();drawBlasts();drawTimeWave();
 for(const p of parts){ctx.globalAlpha=Math.max(p.life,0);circle(p.x,p.y,3,p.color,8);ctx.globalAlpha=1}
 if(timeStop>0){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.shadowBlur=0;ctx.globalCompositeOperation='saturation';ctx.fillStyle='rgb(128,128,128)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(90,140,255,0.12)';ctx.fillRect(0,0,W,H);ctx.restore();
 }
 for(const id in P){                                    // игроки
  const p=P[id];if(p.lives<=0)continue;
  if(p.shield>0){glow('#4df',20);ctx.strokeStyle='#4df';ctx.lineWidth=3;ctx.globalAlpha=p.shield<1.5?(Math.sin(time*25)>0?1:0.3):1;ctx.beginPath();ctx.arc(p.x,p.y,p.r+9,0,Math.PI*2);ctx.stroke()}
  ctx.globalAlpha=(p.inv>0&&Math.sin(time*40)>0)?0.35:1;circle(p.x,p.y,p.r,PCOL[p.c%6],id===me?22:12);drawHeldWeapon(p);ctx.globalAlpha=1;ctx.shadowBlur=0;
  if(id!==me){ctx.fillStyle=PCOL[p.c%6];ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('И'+(p.c+1)+' '+'♥'.repeat(p.lives),p.x,p.y-26)}
 }
 ctx.shadowBlur=0;ctx.textAlign='center';
 for(const t of texts){if(t.s)continue;ctx.globalAlpha=Math.min(1,t.life);ctx.fillStyle=t.color;ctx.font='bold '+t.size+'px system-ui';ctx.fillText(t.text,t.x,t.y)}
 ctx.globalAlpha=1;ctx.setTransform(1,0,0,1,0,0);
 for(const t of texts){if(!t.s)continue;ctx.globalAlpha=Math.min(1,t.life);ctx.fillStyle=t.color;ctx.font='bold '+t.size+'px system-ui';ctx.fillText(t.text,t.x,t.y)}
 ctx.globalAlpha=1;

 // HUD
 ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 22px system-ui';ctx.fillText('Очки: '+L.score,16,34);
 ctx.font='16px system-ui';ctx.fillStyle='#9ab';ctx.fillText('Рекорд: '+best,16,58);
 ctx.textAlign='right';ctx.fillStyle='#f66';ctx.font='22px system-ui';ctx.fillText('♥'.repeat(Math.max(L.lives,0)),W-16,34);
 if(L.combo>1){ctx.fillStyle='#fd4';ctx.font='bold 20px system-ui';ctx.fillText('x'+L.combo+' комбо',W-16,62)}
 if(play){
  drawCrateArrows(L);drawMinimap();drawControls(L);drawTimeUI(L);drawAmmo(L);drawWeaponBar(L);drawBossBar();
  const ids=Object.keys(P).filter(i=>i!==me);                                 // команда
  ctx.textAlign='left';ctx.font='12px system-ui';
  ids.forEach((i,k)=>{const p=P[i];ctx.fillStyle=PCOL[p.c%6];ctx.fillText('И'+(p.c+1)+': '+p.score+'  '+(p.lives>0?'♥'.repeat(p.lives):'выбыл'),16,196+k*18)});
  if(net){ctx.fillStyle='#6a7390';ctx.textAlign='center';ctx.fillText('Комната '+rid0.slice(1)+' · игроков: '+Object.keys(P).length,W/2,H-6)}
  if(!isHost&&!lp()){ctx.fillStyle='#9ab';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText('Жду данные от хоста…',W/2,H/2)}
  else if(L.lives<=0){ctx.fillStyle='#ff7a5a';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('Ты выбыл — смотри за друзьями',W/2,H-70)}
 }else{
  ctx.fillStyle='rgba(7,9,20,0.78)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  glow('#f54',20);ctx.fillStyle='#f54';ctx.font='bold 40px system-ui';ctx.fillText('ИГРА ОКОНЧЕНА',W/2,H*.24);ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='22px system-ui';ctx.fillText('Твои очки: '+L.score,W/2,H*.31);
  ctx.fillStyle=L.score>=best&&L.score>0?'#fd4':'#9ab';ctx.font='17px system-ui';ctx.fillText(L.score>=best&&L.score>0?'Новый рекорд!':'Рекорд: '+best,W/2,H*.36);
  Object.keys(P).sort((a,b)=>P[b].score-P[a].score).slice(0,6).forEach((i,k)=>{ctx.fillStyle=PCOL[P[i].c%6];ctx.font='15px system-ui';ctx.fillText((i===me?'ты':'игрок '+(P[i].c+1))+': '+P[i].score,W/2,H*.41+k*22)});
  let y=H*.41+Object.keys(P).length*22+16;
  if(!net){btn('Играть снова',y,solo);y+=60}
  btn('В меню',y,leave,'#889');
 }
}
reset(['me']);mode='menu';requestAnimationFrame(loop);

</script></body></html>
